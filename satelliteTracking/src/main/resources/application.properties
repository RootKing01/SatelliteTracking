# =============================================================================
# Satellite Tracker - configurazione UNICA (src/main/resources)
#
# Questo file sostituisce application.properties + application-dev.properties
# + application-test.properties. Il profilo "test" resta SOLO in
# src/test/resources/application-test.properties (H2, secret fittizi, ecc.).
#
# Ogni valore si puo' sovrascrivere con una variabile d'ambiente:
#   - placeholder esplicito   ->  ${NOME_VARIABILE:default}
#   - proprieta' spring.*     ->  relaxed binding (spring.jpa.show-sql -> SPRING_JPA_SHOW_SQL)
#
# ATTENZIONE: il default ${VAR:default} vale solo se la variabile NON esiste.
# Se e' definita ma vuota (es. "VAR=" nel .env o "${VAR}" nel compose senza
# valore) vince la stringa vuota. Nel docker-compose usa ${VAR:-default}.
#
# VARIABILI OBBLIGATORIE (nessun default: senza, l'app non parte):
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
#   APP_SECURITY_JWT_SECRET (min. 32 caratteri), SPACETRACK_USERNAME, SPACETRACK_PASSWORD
# =============================================================================

spring.application.name=Satellite Tracker

# -----------------------------------------------------------------------------
# Database e JPA
# -----------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# "update" crea/modifica le tabelle da solo: comodo ma rischioso in produzione.
# Quando introduci Flyway/Liquibase passa a "validate".
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
# Stampa ogni query SQL: utile solo per debug (SPRING_JPA_SHOW_SQL=true).
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# -----------------------------------------------------------------------------
# Sicurezza: CORS, JWT, cookie
# -----------------------------------------------------------------------------
# Origini del browser ammesse (separate da virgola, schema+host+porta ESATTI).
app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS:http://localhost:5173, http://127.0.0.1:5173, https://localhost:5173, https://127.0.0.1:5173}

# Secret HMAC del JWT: obbligatorio, nessun default noto.
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET}
app.security.jwt.expiration-ms=${APP_SECURITY_JWT_EXPIRATION_MS:28800000}
app.security.jwt.cookie-name=${APP_SECURITY_JWT_COOKIE_NAME:st_auth}
# Cookie "Secure": con true il browser lo accetta solo via HTTPS.
# Sviluppo locale in HTTP (sostituisce il vecchio profilo "dev"):
#   APP_SECURITY_JWT_COOKIE_SECURE=false
app.security.jwt.cookie-secure=${APP_SECURITY_JWT_COOKIE_SECURE:true}
app.security.jwt.cookie-same-site=${APP_SECURITY_JWT_COOKIE_SAME_SITE:Lax}

# Utente demo creato all'avvio se non esiste.
# !!! In produzione imposta APP_AUTH_BOOTSTRAP_ENABLED=false (le credenziali
# di default sono pubbliche) oppure cambia username/password.
app.auth.bootstrap.enabled=${APP_AUTH_BOOTSTRAP_ENABLED:true}
app.auth.bootstrap.username=${APP_AUTH_BOOTSTRAP_USERNAME:demo}
app.auth.bootstrap.email=${APP_AUTH_BOOTSTRAP_EMAIL:demo@satellitetracker.local}
app.auth.bootstrap.password=${APP_AUTH_BOOTSTRAP_PASSWORD:Demo123!}

# -----------------------------------------------------------------------------
# Scheduler (job periodici: TLE, SATCAT, missioni, notifiche Telegram)
# Se la proprieta' manca lo scheduler e' ATTIVO (matchIfMissing=true nel codice).
# -----------------------------------------------------------------------------
app.scheduler.enabled=${APP_SCHEDULER_ENABLED:true}

# -----------------------------------------------------------------------------
# Telegram (token da @BotFather; vuoto = notifiche disattivate)
# -----------------------------------------------------------------------------
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}

# -----------------------------------------------------------------------------
# Posizione osservatore di default (unica fonte)
# -----------------------------------------------------------------------------
satellite.default-location.latitude=41.01
satellite.default-location.longitude=14.30
satellite.default-location.altitude=30.0
satellite.default-location.name=San Marcellino, Caserta, Italia

# -----------------------------------------------------------------------------
# Sorgente TLE e Space-Track
# -----------------------------------------------------------------------------
tle.source.primary=spacetrack
# Soglia (rev/giorno) oltre la quale un satellite e' considerato LEO.
tle.leo.threshold=${TLE_LEO_THRESHOLD:11.0}

# Credenziali Space-Track: obbligatorie.
spacetrack.username=${SPACETRACK_USERNAME}
spacetrack.password=${SPACETRACK_PASSWORD}
spacetrack.gp.max.per.minute=${SPACETRACK_GP_MAX_PER_MINUTE:30}
# Tetto ai risultati delle query GP recenti (piu' basso = delta piu' frequenti).
spacetrack.gp.max.results=${SPACETRACK_GP_MAX_RESULTS:2500}
spacetrack.gp.lookback.max.hours=${SPACETRACK_GP_LOOKBACK_MAX_HOURS:12}
spacetrack.max.concurrent=${SPACETRACK_MAX_CONCURRENT:1}

# -----------------------------------------------------------------------------
# SATCAT: paginazione e limiti di richieste
# -----------------------------------------------------------------------------
# Dimensione pagina nella scansione dei satelliti sconosciuti.
satcat.batch.size=${SATCAT_BATCH_SIZE:100}
satcat.max.per.minute=${SATCAT_MAX_PER_MINUTE:29}
satcat.max.per.hour=${SATCAT_MAX_PER_HOUR:299}
satcat.cooldown.hours=${SATCAT_COOLDOWN_HOURS:2}
satcat.daily.cooldown.hours=${SATCAT_DAILY_COOLDOWN_HOURS:24}

# -----------------------------------------------------------------------------
# File di audit (append-only) dei nuovi satelliti scoperti.
# In Docker e' impostato dal compose (SATELLITE_AUDIT_FILE_PATH=/app/...).
# -----------------------------------------------------------------------------
satellite.audit.file-path=${SATELLITE_AUDIT_FILE_PATH:../satellite-new-satellites.txt}
server.error.include-message=always