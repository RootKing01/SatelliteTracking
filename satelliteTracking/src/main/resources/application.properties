spring.application.name=Satellite Tracker
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Telegram Bot Configuration
# Crea bot con @BotFather su Telegram e ottieni il token
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}

# Default observer location (single source of truth)
satellite.default-location.latitude=41.01
satellite.default-location.longitude=14.30
satellite.default-location.altitude=30.0
satellite.default-location.name=San Marcellino, Caserta, Italia

# Session auth and CORS
app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:change-me-super-secret-key-change-me-super-secret-key}
app.security.jwt.expiration-ms=${APP_SECURITY_JWT_EXPIRATION_MS:28800000}
app.security.jwt.cookie-name=${APP_SECURITY_JWT_COOKIE_NAME:st_auth}
app.security.jwt.cookie-secure=${APP_SECURITY_JWT_COOKIE_SECURE:true}
app.security.jwt.cookie-same-site=${APP_SECURITY_JWT_COOKIE_SAME_SITE:Lax}

# Bootstrap profile (default user)
app.auth.bootstrap.enabled=${APP_AUTH_BOOTSTRAP_ENABLED:true}
app.auth.bootstrap.username=${APP_AUTH_BOOTSTRAP_USERNAME:demo}
app.auth.bootstrap.email=${APP_AUTH_BOOTSTRAP_EMAIL:demo@satellitetracker.local}
app.auth.bootstrap.password=${APP_AUTH_BOOTSTRAP_PASSWORD:Demo123!}

# === TLE Data Sources Configuration ===
tle.source.primary=spacetrack
tle.batch.size=100

# Space-Track credentials
spacetrack.username=${SPACETRACK_USERNAME}
spacetrack.password=${SPACETRACK_PASSWORD}
spacetrack.gp.max.per.minute=${SPACETRACK_GP_MAX_PER_MINUTE:30}
# cap for recent GP queries; keep it lower for frequent deltas
spacetrack.gp.max.results=${SPACETRACK_GP_MAX_RESULTS:2500}

# SATCAT and throttling configuration
# pagination size when scanning unknown satellites
satcat.batch.size=${SATCAT_BATCH_SIZE:100}
# how many NORAD ids to include in a single grouped SATCAT call
satcat.norads.per.call=${SATCAT_NORADS_PER_CALL:500}
# pause between grouped SATCAT calls (ms)
satcat.pause.ms=${SATCAT_PAUSE_MS:3000}
satcat.max.per.minute=${SATCAT_MAX_PER_MINUTE:29}
satcat.max.per.hour=${SATCAT_MAX_PER_HOUR:299}
satcat.cooldown.hours=${SATCAT_COOLDOWN_HOURS:2}
satcat.daily.cooldown.hours=${SATCAT_DAILY_COOLDOWN_HOURS:24}

# Append-only text file for newly discovered satellites.
# From the backend module, this resolves to the repo-root satellite-new-satellites.txt.
satellite.audit.file-path=${SATELLITE_AUDIT_FILE_PATH:../satellite-new-satellites.txt}