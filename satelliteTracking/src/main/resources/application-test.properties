# Spring Boot Test Profile Configuration
# Used when running tests with @SpringBootTest or @DataJpaTest

# Use in-memory H2 database for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration for test environment
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable Telegram notifications in tests
telegram.bot.token=

# Use default JWT secret for tests
app.security.jwt.secret=test-secret-key-do-not-use-in-production
app.security.jwt.expiration-ms=28800000
app.security.jwt.cookie-name=st_auth
app.security.jwt.cookie-secure=false
app.security.jwt.cookie-same-site=Lax

# Allowed origins for test
app.security.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Bootstrap test user
app.auth.bootstrap.enabled=true
app.auth.bootstrap.username=demo
app.auth.bootstrap.email=demo@satellitetracker.local
app.auth.bootstrap.password=Demo123!

# Test default location
satellite.default-location.latitude=41.01
satellite.default-location.longitude=14.30
satellite.default-location.altitude=30.0
satellite.default-location.name=Test Location
