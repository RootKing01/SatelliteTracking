services:

  # Container dedicato per i dati Orekit
  orekit-data:
    build:
      context: .
      dockerfile: orekit-data.Dockerfile
    container_name: ${OREKIT_CONTAINER_NAME}
    volumes:
      - orekit-data-volume:/data
    deploy:
      resources:
        limits:
          memory: ${OREKIT_MEMORY_LIMIT}

  db:
    image: ${DB_IMAGE}
    container_name: ${DB_CONTAINER_NAME}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT}

  app:
    build:
      context: satelliteTracking
      dockerfile: Dockerfile
    container_name: ${APP_CONTAINER_NAME}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT}:8080"
    depends_on:
      - db
      - orekit-data
    volumes:
      - orekit-data-volume:/orekit-data:ro
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      APP_SECURITY_ALLOWED_ORIGINS: ${APP_SECURITY_ALLOWED_ORIGINS}
    
    deploy:
       resources:
        limits:
          memory: ${APP_MEMORY_LIMIT}

  frontend-dev:
    profiles: ["dev"]
    image: node:20-alpine
    container_name: ${FRONTEND_DEV_CONTAINER_NAME:-satellite-tracker-frontend-dev}
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port ${FRONTEND_DEV_PORT:-5173}"
    ports:
      - "${FRONTEND_DEV_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_DEV_PORT:-5173}:${FRONTEND_DEV_PORT:-5173}"
    depends_on:
      - app
    environment:
      VITE_CESIUM_TOKEN: ${VITE_CESIUM_TOKEN}
      VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN}
      VITE_DEV_PROXY_TARGET: http://app:8080
      VITE_DEV_USE_HTTPS: ${VITE_DEV_USE_HTTPS:-false}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./satelliteTracking-frontend:/app
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_DEV_MEMORY_LIMIT:-1g}

  frontend:
    profiles: ["prod"]
    build:
      context: satelliteTracking-frontend
      dockerfile: Dockerfile
      args:
        VITE_CESIUM_TOKEN: ${VITE_CESIUM_TOKEN}
        VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN}
    container_name: ${FRONTEND_CONTAINER_NAME:-satellite-tracker-frontend}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEMORY_LIMIT:-512m}
volumes:
  orekit-data-volume:
  postgres-data:
